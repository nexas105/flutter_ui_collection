name: flutter_ui_collection
description: >
  A complete Flutter UI framework — 89 core components + 6 modules (Auth, Chat,
  Dashboard, E-Commerce, Social, Settings), 8 design presets, 7 effects.
  170+ files, ~30K LOC. Fully independent of Material Design.
version: 2.0.0
homepage: https://github.com/tobiasludwig/flutter_ui_collection
repository: https://github.com/tobiasludwig/flutter_ui_collection
issue_tracker: https://github.com/tobiasludwig/flutter_ui_collection/issues

topics:
  - ui
  - design-system
  - widgets
  - neon
  - theming

environment:
  sdk: ^3.11.5
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
