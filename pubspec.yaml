name: flutter_ui_collection
description: >
  A modular, design-system-agnostic Flutter UI component library.
  Ships with 4 built-in design presets (Neon, Glass, Minimal, Cyberpunk)
  and 10 fully themed, customizable components — independent of Material Design.
version: 0.1.0
homepage: https://github.com/tobiasludwig/flutter_ui_collection
repository: https://github.com/tobiasludwig/flutter_ui_collection
issue_tracker: https://github.com/tobiasludwig/flutter_ui_collection/issues

topics:
  - ui
  - design-system
  - widgets
  - neon
  - theming

environment:
  sdk: ^3.11.5
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
